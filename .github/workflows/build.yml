name: Build Mod
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt' # You can choose other OpenJDK distributions.
      - name: Update Build Script (Before Build)
        run: ./gradlew updateBuildScript
      - name: Build with Gradle
        run: ./gradlew build
      - name: Test Gradle Download
        run: |
          curl -IL --max-time 60 https://services.gradle.org/distributions/gradle-8.5-bin.zip
          curl -IL --max-time 60 https://downloads.gradle.org/distributions/gradle-8.5-bin.zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AE2-UEL
          path: build/libs/*.jar # Make sure this path matches the location of your build artifacts
